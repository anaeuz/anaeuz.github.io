name: Renovar token do Instagram

# O token de longa duração vale 60 dias. Renovando toda semana ele nunca expira.
on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar e salvar o novo token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RESPOSTA=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}") \
            || { echo "Falha ao renovar. Gere um token novo no painel da Meta."; exit 1; }
          NOVO=$(echo "$RESPOSTA" | jq -r '.access_token // empty')
          echo "::add-mask::$NOVO"
          test -n "$NOVO" || { echo "Resposta sem token."; exit 1; }
          gh secret set IG_ACCESS_TOKEN --body "$NOVO" --repo "$GITHUB_REPOSITORY"
          echo "Token renovado. Expira em $(echo "$RESPOSTA" | jq '.expires_in / 86400 | floor') dias."
